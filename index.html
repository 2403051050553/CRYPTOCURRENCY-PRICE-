<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cryptocurrency Price Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Cryptocurrency Price Tracker</h1>
    <p class="subtitle">Live prices in USD (updates on refresh)</p>

    <div class="search-box">
      <input type="text" id="coinInput" placeholder="Enter coin name (e.g. bitcoin)">
      <button id="searchBtn">Search</button>
      <button id="refreshBtn">Refresh All</button>
    </div>

    <p id="errorMsg"></p>

    <div id="singleResult" class="coin-box"></div>

    <h2>Top 10 Coins</h2>
    <table id="coinTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Coin</th>
          <th>Price (USD)</th>
          <th>24h Change</th>
        </tr>
      </thead>
      <tbody id="coinTableBody">
      </tbody>
    </table>

  </div>

  <script src="script.js"></script>
</body>
</html>
